<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escape — Videos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #0e0e14;
      color: #eeeaff;
      min-height: 100vh;
      padding: 36px 20px 60px;
    }

    .container { max-width: 600px; margin: 0 auto; }

    /* ── Top nav ── */
    .top-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .top-nav a {
      flex: 1;
      text-align: center;
      padding: 10px 16px;
      border-radius: 10px;
      font-family: sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-decoration: none;
      color: #6868a0;
      background: #13131c;
      border: 1px solid #22222f;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .top-nav a:hover { color: #eeeaff; border-color: #3e3e58; }

    .top-nav a.active {
      color: #0e0e14;
      background: #eeeaff;
      border-color: #eeeaff;
    }

    /* ── Header ── */
    .header {
      padding-bottom: 14px;
      border-bottom: 2px solid #eeeaff;
      margin-bottom: 28px;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: #eeeaff;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .subtitle {
      font-size: 0.72rem;
      color: #3e3e58;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: #2e2e44;
      border: 1px dashed #1a1a26;
      border-radius: 10px;
    }

    .empty-icon { font-size: 2rem; margin-bottom: 10px; }
    .empty-msg  { font-size: 0.9rem; color: #3e3e58; line-height: 1.6; }

    /* ── Add-video form ── */
    .card {
      background: #13131c;
      border: 1px solid #22222f;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 28px;
    }
    
    label {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #3e3e58;
      margin-bottom: 6px;
      margin-top: 14px;
    }
    
    label:first-child { margin-top: 0; }
    
    input {
      width: 100%;
      background: #0a0a10;
      border: 1px solid #22222f;
      border-radius: 8px;
      padding: 10px 12px;
      color: #eeeaff;
      font-size: 0.95rem;
      font-family: sans-serif;
      transition: border-color 0.2s;
    }
    
    input::placeholder { color: #2e2e44; }
    input:focus { outline: none; border-color: #8b7fdf; }
    
    .add-btn {
      margin-top: 16px;
      width: 100%;
      background: #eeeaff;
      color: #0e0e14;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      font-family: sans-serif;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .add-btn:hover:not(:disabled) { background: #ffffff; }
    .add-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    
    .error {
      margin-top: 10px;
      color: #e05c7a;
      font-size: 0.82rem;
    }
    
    .fetch-status {
      margin-top: 6px;
      font-size: 0.78rem;
      color: #3e3e58;
      min-height: 1rem;
    }
    
    /* ── Video grid ── */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    
    .video-card {
      position: relative;
      background: #13131c;
      border: 1px solid #22222f;
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    
    .video-card:hover { border-color: #3e3e58; }
    
    .video-link {
      display: block;
      text-decoration: none;
    }
    
    .video-del {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 2;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10,10,16,0.75);
      border: 1px solid #2a2a44;
      border-radius: 50%;
      color: #eeeaff;
      font-size: 0.75rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    
    .video-del:hover { background: #e05c7a; color: #fff; }
    
    .video-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #0a0a10;
      display: block;
    }
    
    .video-thumb-fallback {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a10;
      font-size: 1.8rem;
      color: #2e2e44;
    }
    
    .video-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: #eeeaff;
      padding: 10px 12px;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="container">

    <nav class="top-nav">
      <a href="index.html">Stories</a>
      <a href="videos.html" class="active">Videos</a>
    </nav>

    <div class="header">
      <h1>Videos</h1>
      <p class="subtitle">Coming soon</p>
    </div>

    <div class="card">
      <label for="vTitle">Video Title</label>
      <input type="text" id="vTitle" placeholder="e.g. How black holes form" />
    
      <label for="vLink">Video Link</label>
      <input type="url" id="vLink" placeholder="https://..." />
      <p class="fetch-status" id="vFetchStatus"></p>
    
      <button class="add-btn" id="vAddBtn" onclick="addVideo()">+ Add Video</button>
      <p class="error" id="vError"></p>
    </div>
    
    <div class="video-grid" id="videoGrid"></div>

  </div>

  <script>
    const SUPABASE_URL  = "https://rdjrwxwuyugmjsuvscsx.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkanJ3eHd1eXVnbWpzdXZzY3N4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MzAzOTEsImV4cCI6MjA5NjQwNjM5MX0.2xm0WOMaelheQAI1_NGkLdgUTkohiiolwsDxHT1Z-aU";
  
    const BASE = `${SUPABASE_URL}/rest/v1/videos`;
    const HEADERS = {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON,
      "Authorization": `Bearer ${SUPABASE_ANON}`,
    };
  
    async function loadVideos() {
      const res = await fetch(`${BASE}?select=id,title,link,thumbnail&order=created_at.desc`, { headers: HEADERS });
      const videos = await res.json();
      renderVideos(videos);
    }
  
    function renderVideos(videos) {
      const grid = document.getElementById("videoGrid");
      if (!videos.length) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1;"><div class="empty-icon">🎬</div><div class="empty-msg">No videos yet. Add your first one above.</div></div>`;
        return;
      }
  
      grid.innerHTML = videos.map(v => {
        const thumb = v.thumbnail
          ? `<img class="video-thumb" src="${v.thumbnail}" alt="" loading="lazy" onerror="this.outerHTML='<div class=video-thumb-fallback>🎬</div>'" />`
          : `<div class="video-thumb-fallback">🎬</div>`;
        return `
          <div class="video-card">
            <button class="video-del" onclick="deleteVideo(${v.id}, this)" title="Remove">✕</button>
            <a class="video-link" href="${v.link}" target="_blank" rel="noopener noreferrer">
              ${thumb}
              <div class="video-title">${v.title}</div>
            </a>
          </div>`;
      }).join("");
    }
  
    // Reuses the same Microlink approach your Stories page uses for auto-fill,
    // but here we only need the og:image for the thumbnail.
    async function fetchThumbnail(link) {
      try {
        const res  = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(link)}`);
        const data = await res.json();
        if (data.status === "success" && data.data.image && data.data.image.url) {
          return data.data.image.url;
        }
      } catch {}
      return null;
    }
  
    async function addVideo() {
      const title  = document.getElementById("vTitle").value.trim();
      const link   = document.getElementById("vLink").value.trim();
      const error  = document.getElementById("vError");
      const status = document.getElementById("vFetchStatus");
      const btn    = document.getElementById("vAddBtn");
  
      if (!title) { error.textContent = "Please enter a video title."; return; }
      if (!link)  { error.textContent = "Please enter a video link."; return; }
      if (!link.startsWith("http")) { error.textContent = "Link must start with https://"; return; }

    async function deleteVideo(id, btn) {
      if (!confirm("Remove this video?")) {
        return;
      }
    
      btn.disabled = true;
      btn.textContent = "…";
    
      const res = await fetch(`${BASE}?id=eq.${id}`, {
        method: "DELETE",
        headers: { ...HEADERS, "Prefer": "return=minimal" },
      });
    
      if (res.ok) {
        loadVideos();
      } else {
        btn.disabled = false;
        btn.textContent = "✕";
        alert("Failed to delete. Check your Supabase RLS policy for DELETE.");
      }
    }
  
      error.textContent = "";
      btn.disabled = true;
      btn.textContent = "Saving…";
      status.textContent = "Fetching thumbnail…";
  
      const thumbnail = await fetchThumbnail(link);
      status.textContent = thumbnail ? "" : "Couldn't fetch a thumbnail — saved without one.";
  
      const res = await fetch(BASE, {
        method: "POST",
        headers: { ...HEADERS, "Prefer": "return=representation" },
        body: JSON.stringify({ title, link, thumbnail }),
      });
  
      btn.disabled = false;
      btn.textContent = "+ Add Video";
  
      if (res.ok) {
        document.getElementById("vTitle").value = "";
        document.getElementById("vLink").value  = "";
        loadVideos();
      } else {
        error.textContent = "Failed to save. Check your Supabase config.";
      }
    }
  
    loadVideos();
  </script>
</body>
</html>
