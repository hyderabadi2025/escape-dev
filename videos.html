<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escape — Videos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #0e0e14;
      color: #eeeaff;
      min-height: 100vh;
      padding: 36px 20px 60px;
    }

    .container { max-width: 600px; margin: 0 auto; }

    /* ── Top nav ── */
    .top-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .top-nav a {
      flex: 1;
      text-align: center;
      padding: 10px 16px;
      border-radius: 10px;
      font-family: sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-decoration: none;
      color: #6868a0;
      background: #13131c;
      border: 1px solid #22222f;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .top-nav a:hover { color: #eeeaff; border-color: #3e3e58; }

    .top-nav a.active {
      color: #0e0e14;
      background: #eeeaff;
      border-color: #eeeaff;
    }

    /* ── Header ── */
    .header {
      padding-bottom: 14px;
      border-bottom: 2px solid #eeeaff;
      margin-bottom: 28px;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: #eeeaff;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .subtitle {
      font-size: 0.72rem;
      color: #3e3e58;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: #2e2e44;
      border: 1px dashed #1a1a26;
      border-radius: 10px;
    }

    .empty-icon { font-size: 2rem; margin-bottom: 10px; }
    .empty-msg  { font-size: 0.9rem; color: #3e3e58; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">

    <nav class="top-nav">
      <a href="index.html">Stories</a>
      <a href="videos.html" class="active">Videos</a>
    </nav>

    <div class="header">
      <h1>Videos</h1>
      <p class="subtitle">Coming soon</p>
    </div>

    <div class="empty">
      <div class="empty-icon">🎬</div>
      <div class="empty-msg">This page is set up and ready to go —<br>the video player and Supabase Storage hookup land next.</div>
    </div>

  </div>
</body>
</html>
