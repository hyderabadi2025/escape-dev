<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escape — Videos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #0e0e14;
      color: #eeeaff;
      min-height: 100vh;
      padding: 36px 20px 60px;
    }

    .container { max-width: 600px; margin: 0 auto; }

    /* ── Top nav ── */
    .top-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .top-nav a {
      flex: 1;
      text-align: center;
      padding: 10px 16px;
      border-radius: 10px;
      font-family: sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-decoration: none;
      color: #6868a0;
      background: #13131c;
      border: 1px solid #22222f;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .top-nav a:hover { color: #eeeaff; border-color: #3e3e58; }

    .top-nav a.active {
      color: #0e0e14;
      background: #eeeaff;
      border-color: #eeeaff;
    }

    /* ── Header ── */
    .header {
      padding-bottom: 14px;
      border-bottom: 2px solid #eeeaff;
      margin-bottom: 28px;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: #eeeaff;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .subtitle {
      font-size: 0.72rem;
      color: #3e3e58;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: #2e2e44;
      border: 1px dashed #1a1a26;
      border-radius: 10px;
    }

    .empty-icon { font-size: 2rem; margin-bottom: 10px; }
    .empty-msg  { font-size: 0.9rem; color: #3e3e58; line-height: 1.6; }

    /* ── Add-video form ── */
    .card {
      background: #13131c;
      border: 1px solid #22222f;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 28px;
    }
    
    label {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #3e3e58;
      margin-bottom: 6px;
      margin-top: 14px;
    }
    
    label:first-child { margin-top: 0; }
    
    input {
      width: 100%;
      background: #0a0a10;
      border: 1px solid #22222f;
      border-radius: 8px;
      padding: 10px 12px;
      color: #eeeaff;
      font-size: 0.95rem;
      font-family: sans-serif;
      transition: border-color 0.2s;
    }
    
    input::placeholder { color: #2e2e44; }
    input:focus { outline: none; border-color: #8b7fdf; }
    
    .add-btn {
      margin-top: 16px;
      width: 100%;
      background: #eeeaff;
      color: #0e0e14;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      font-family: sans-serif;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .add-btn:hover:not(:disabled) { background: #ffffff; }
    .add-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    
    .error {
      margin-top: 10px;
      color: #e05c7a;
      font-size: 0.82rem;
    }
    
    .fetch-status {
      margin-top: 6px;
      font-size: 0.78rem;
      color: #3e3e58;
      min-height: 1rem;
    }
    
    /* ── Video grid ── */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    
    .video-card {
      display: block;
      text-decoration: none;
      background: #13131c;
      border: 1px solid #22222f;
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    
    .video-card:hover { border-color: #3e3e58; }
    
    .video-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #0a0a10;
      display: block;
    }
    
    .video-thumb-fallback {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a10;
      font-size: 1.8rem;
      color: #2e2e44;
    }
    
    .video-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: #eeeaff;
      padding: 10px 12px;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="container">

    <nav class="top-nav">
      <a href="index.html">Stories</a>
      <a href="videos.html" class="active">Videos</a>
    </nav>

    <div class="header">
      <h1>Videos</h1>
      <p class="subtitle">Coming soon</p>
    </div>

    <div class="card">
      <label for="vTitle">Video Title</label>
      <input type="text" id="vTitle" placeholder="e.g. How black holes form" />
    
      <label for="vLink">Video Link</label>
      <input type="url" id="vLink" placeholder="https://..." />
      <p class="fetch-status" id="vFetchStatus"></p>
    
      <button class="add-btn" id="vAddBtn" onclick="addVideo()">+ Add Video</button>
      <p class="error" id="vError"></p>
    </div>
    
    <div class="video-grid" id="videoGrid"></div>

  </div>
</body>
</html>
